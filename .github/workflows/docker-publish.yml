name: Docker Hub image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing SemVer tag to build, for example v0.1.0 or v0.2.0-rc.1
        required: true
        type: string
      publish:
        description: Push to Docker Hub (requires configured repository secrets)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: docker-hub-release
  cancel-in-progress: false

jobs:
  image:
    if: github.repository == 'Synapsr/Repere'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Validate release version
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease || false }}
          PUBLISH_IMAGE: ${{ github.event_name == 'release' || inputs.publish }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const tag = (process.env.RELEASE_TAG || '').trim();
          const match = /^v?(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-([0-9A-Za-z.-]+))?$/.exec(tag);
          const validPrerelease = !match?.[4] || match[4].split('.').every(part =>
            /^(?:0|[1-9]\d*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)$/.test(part));
          if (!match || !validPrerelease || tag.length > 128) {
            console.error('Use an existing SemVer release tag without build metadata, for example v0.1.0 or v0.2.0-rc.1.');
            process.exit(1);
          }
          const version = tag.replace(/^v/, '');
          const stable = !match[4] && process.env.RELEASE_PRERELEASE !== 'true';
          fs.appendFileSync(process.env.GITHUB_OUTPUT, [
            `tag=${tag}`,
            `version=${version}`,
            `minor=${match[1]}.${match[2]}`,
            `major=${match[1]}`,
            `stable=${stable}`,
            `major_tag=${stable && match[1] !== '0'}`,
            `publish=${process.env.PUBLISH_IMAGE === 'true'}`,
            ''
          ].join('\n'));
          NODE
      - name: Check registry credentials before publishing
        if: steps.release.outputs.publish == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo '::error::Configure DOCKERHUB_USERNAME and DOCKERHUB_TOKEN with push access to synapsr/repere before publishing.'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.release.outputs.publish == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Image tags and labels
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: synapsr/repere
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.release.outputs.version }}
            type=raw,value=${{ steps.release.outputs.minor }},enable=${{ steps.release.outputs.stable }}
            type=raw,value=${{ steps.release.outputs.major }},enable=${{ steps.release.outputs.major_tag }}
            type=raw,value=latest,enable=${{ steps.release.outputs.stable }}
          labels: |
            org.opencontainers.image.title=Repère
            org.opencontainers.image.description=Visual feedback for websites and PDFs, with an optional integrated MySQL database
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=https://github.com/Synapsr/Repere
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
      - name: Build both architectures
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.all-in-one
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.release.outputs.publish == 'true' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=repere-all-in-one
          cache-to: type=gha,mode=max,scope=repere-all-in-one
      - name: Record the result
        env:
          TAGS: ${{ steps.metadata.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PUBLISHED: ${{ steps.release.outputs.publish }}
        run: |
          {
            echo '## Repère Docker image'
            echo
            echo "Published to Docker Hub: $PUBLISHED"
            echo
            echo 'Platforms: linux/amd64, linux/arm64'
            echo
            echo 'Tags:'
            echo '```text'
            echo "$TAGS"
            echo '```'
            echo
            echo "Build digest: $DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
