name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - name: Verify fresh install and upgrades on isolated MySQL
        run: npm run test:migrations
      - name: Verify invitation delivery races on isolated MySQL
        run: npm run test:invitations

  integration:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [api, browsers]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install both browsers
        if: matrix.suite == 'browsers'
        run: npx playwright install --with-deps chromium firefox
      - name: Start complete local stack (MySQL, migrations, app, native preview, Mailpit)
        run: npm run setup
      # Independent runners keep real OTP traffic below the normal network limit.
      # Authentication protections remain enabled in both suites.
      - name: API integration tests
        if: matrix.suite == 'api'
        run: npm run test:integration
      - name: Chromium and Firefox integration tests
        if: matrix.suite == 'browsers'
        run: npm run test:ui
      - name: Container logs
        if: failure()
        run: docker compose -f compose.yaml -f compose.dev.yaml logs --tail=150
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-results-${{ matrix.suite }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Stop test stack
        if: always()
        run: docker compose -f compose.yaml -f compose.dev.yaml down --volumes
