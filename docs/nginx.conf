# Advanced Compose setup: application on 3000, preview service on 3001.
# Point app.repere.dev and *.repere.dev to this host and provide wildcard TLS (DNS-01).
# The apex repere.dev can belong to a separate website; configure it separately.
# The all-in-one image instead routes both app and previews through port 8080.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl;
    server_name app.repere.dev;
    ssl_certificate /etc/letsencrypt/live/app.repere.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.repere.dev/privkey.pem;
    client_max_body_size 21m;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Overwrite client-supplied values before enabling TRUST_PROXY in the app.
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}

server {
    listen 443 ssl;
    server_name "~^[a-f0-9]{48}\.repere\.dev$";
    ssl_certificate /etc/letsencrypt/live/repere.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/repere.dev/privkey.pem;
    client_max_body_size 25m;
    # Preview hostnames are temporary capabilities; avoid recording them in access logs.
    access_log off;
    location /__repere/sessions { return 404; }
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3700s;
        proxy_send_timeout 3700s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_redirect off;
    }
}

server {
    listen 80;
    server_name app.repere.dev *.repere.dev;
    return 301 https://$host$request_uri;
}
