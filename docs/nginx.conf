# Two separate registrable domains. Point *.preview.example.net to this host.
# Supply an application certificate and a wildcard preview certificate (DNS-01).
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl;
    server_name reviews.example.com;
    ssl_certificate /etc/letsencrypt/live/reviews.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reviews.example.com/privkey.pem;
    client_max_body_size 21m;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Overwrite client-supplied values before enabling TRUST_PROXY in the app.
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}

server {
    listen 443 ssl;
    server_name *.preview.example.net;
    ssl_certificate /etc/letsencrypt/live/preview.example.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/preview.example.net/privkey.pem;
    client_max_body_size 25m;
    # Preview hostnames are temporary capabilities; avoid recording them in access logs.
    access_log off;
    location /__repere/sessions { return 404; }
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3700s;
        proxy_send_timeout 3700s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_redirect off;
    }
}

server {
    listen 80;
    server_name reviews.example.com *.preview.example.net;
    return 301 https://$host$request_uri;
}
